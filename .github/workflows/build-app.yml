# AI寶 Windows 原生 App (Rust 殼) 雲端建置與驗證工作流程
#
# 使用方式: 經人工審核後, 把本檔複製到 .github/workflows/build-app.yml 才會被 GitHub Actions 執行
# (workflow_dispatch 必須在預設分支 main 上也有一份才能以 --ref 呼叫 ai-bao)。
#
# 做什麼:
#   1. build-engine: 以既有 pack 管線產出引擎 exe (SEA), 並跑 pack 測試 (含 NO_BROWSER 新測試)。
#   2. build-app: 把引擎 exe 當 payload 嵌入 Rust 殼, cargo release 編出單一 AI寶.exe;
#      在真 Windows runner 上跑探針 (payload 解開、引擎 headless 啟動、雙埠 200、核心 WS 登入往返、
#      CTRL_BREAK 優雅結束、埠釋放), 再跑 GUI 冒煙 (啟動主視窗、截圖、--quit 結束序列、埠釋放),
#      最後把 exe、探針結果、截圖與 log 存成 artifact。
name: build-app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安裝相依並建置核心與 helper
        shell: pwsh
        run: |
          npm ci --include=dev
          npm run build
          Push-Location helper
          npm ci
          Pop-Location

      - name: pack 測試 (含 NO_BROWSER)
        shell: pwsh
        working-directory: pack
        run: |
          npm ci
          npm test

      - name: 打包引擎 exe
        shell: pwsh
        working-directory: pack
        run: |
          node build.mjs --target win --skip-core-build

      - name: 上傳引擎 exe (供下一個 job 嵌入)
        uses: actions/upload-artifact@v4
        with:
          name: aibao-engine
          path: pack/out/AI寶.exe
          retention-days: 1

  build-app:
    needs: build-engine
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 下載引擎 exe 並就位為 payload
        uses: actions/download-artifact@v4
        with:
          name: aibao-engine
          path: engine-dl

      - name: payload 就位
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/payload | Out-Null
          Copy-Item 'engine-dl/AI寶.exe' app/payload/engine.exe
          Get-Item app/payload/engine.exe | Select-Object Length

      - name: 設定 Rust 工具鏈
        uses: dtolnay/rust-toolchain@stable

      - name: 編譯 Rust 殼 (release)
        shell: pwsh
        working-directory: app
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item target/release/aibao-app.exe '../out/AI寶.exe'
          Get-Item '../out/AI寶.exe' | Select-Object Length

      - name: 探針 — 登入往返與結束序列實測
        shell: pwsh
        run: |
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'aibao-probe-data'
          $env:AIBAO_PROBE_OUT = Join-Path $pwd 'probe-result.txt'
          # 凍結 runtime 回歸情境 (2026-10-20 實機定案): 預置事故形狀的舊 runtime 目錄
          # (鍵為舊 package 版本字串 1.8.0+0.1.0, 含完成標記與毒化內容)。
          # 舊版 build 以版本字串為鍵會直接沿用它 → 子行程跑舊碼、探針路由全滅 (紅燈);
          # 新版以內容雜湊為鍵會忽略並清掉它、解開自己的目錄 (綠燈)。
          $staleDir = Join-Path $env:HWLINEHELPER_HOME 'runtime/1.8.0+0.1.0'
          New-Item -ItemType Directory -Force (Join-Path $staleDir 'helper/src') | Out-Null
          Set-Content -Path (Join-Path $staleDir '.extracted-ok') -Value 'files=1'
          Set-Content -Path (Join-Path $staleDir 'helper/src/main.mjs') -Value 'STALE-OLD-CODE'
          $exe = (Resolve-Path 'out/AI寶.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--probe-login' -Wait -PassThru -RedirectStandardOutput probe-stdout.txt -RedirectStandardError probe-stderr.txt
          Write-Host "probe exit code: $($proc.ExitCode)"
          if (Test-Path $env:AIBAO_PROBE_OUT) { Get-Content $env:AIBAO_PROBE_OUT }
          if ($proc.ExitCode -ne 0) { throw "探針失敗 (exit $($proc.ExitCode)), 詳見 probe-result.txt 與 probe-stderr.txt" }
          $result = Get-Content $env:AIBAO_PROBE_OUT -Raw
          if ($result -notmatch 'login_roundtrip=ok') { throw '探針未確認登入往返成功' }
          if ($result -notmatch 'ports_freed=true') { throw '探針未確認結束後埠已釋放' }
          # 端點實測斷言 (2026-10-20 實機 404 教訓): /api/status 200 不夠, 兩個 POST 端點都要實際打通
          if ($result -notmatch 'helper_list_models_route=ok') { throw '探針未確認 /api/list-models 路由存在 (實機曾發生 404)' }
          if ($result -notmatch 'helper_test_ai_route=ok') { throw '探針未確認 /api/test-ai 路由存在且邏輯有跑' }
          if ($result -notmatch 'helper_line_chats_route=ok') { throw '探針未確認 /api/line/chats 路由存在且未登入定案正確' }
          if ($result -notmatch 'helper_line_whitelist_route=ok') { throw '探針未確認 /api/line/whitelist 路由存在且回逐筆清單' }
          # 凍結 runtime 情境的事後斷言: 舊目錄必須被清掉, 且新目錄鍵含內容雜湊
          if (Test-Path $staleDir) { throw '凍結的舊 runtime 目錄未被清除 (新版引擎仍可能沿用舊碼)' }
          $runtimeDirs = Get-ChildItem (Join-Path $env:HWLINEHELPER_HOME 'runtime') -Directory | Where-Object { $_.Name -match '\+[0-9a-f]{12}$' }
          if (-not $runtimeDirs) { throw '未產生內容雜湊鍵的 runtime 目錄' }
          Write-Host "runtime 目錄 (新版): $($runtimeDirs.Name -join ', ')"
          if ($result -notmatch 'helper_status_identity=True') { throw '探針未確認 helper 身分標記' }

      - name: GUI 冒煙 — 啟動、截圖、結束序列
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'out/AI寶.exe').Path
          # 階段 A (修復 B, 2026-10-25 改為出廠預設開啟, 取代 2026-10-22 的關閉預設):
          # 全新資料目錄、不預寫任何設定 — 「開啟程式時自動登入並啟用服務」出廠預設開啟,
          # App 開啟後應直接啟動引擎 (雙埠就緒); --quit 要能乾淨結束。
          # 明確關閉的未啟用態另由逐頁截圖的 overview-idle (auto_login=false) 覆蓋。
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'aibao-gui-default-data'
          $procA = Start-Process -FilePath $exe -PassThru
          $okA = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if ($procA.HasExited) { throw "階段A: 出廠預設下 App 啟動後自行結束 (exit $($procA.ExitCode))" }
            try {
              $a = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3789/' -TimeoutSec 3
              $b = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3
              if ($a.StatusCode -eq 200 -and $b.StatusCode -eq 200) { $okA = $true; break }
            } catch { }
          }
          if (-not $okA) { throw '階段A: 出廠預設 (自動登入開啟) 下 90 秒內引擎雙埠未就緒' }
          Write-Host '階段A: 出廠預設自動登入開啟 — 引擎已啟動 (符合修復 B 新規格)'
          Start-Process -FilePath $exe -ArgumentList '--quit' -Wait
          if (-not $procA.WaitForExit(60000)) { throw '階段A: --quit 後 60 秒內未結束' }
          Write-Host '階段A: --quit 乾淨結束'
          # 階段 B: 預寫 shell-settings.json 開啟 auto_login, 走原本的自動登入全流程驗證。
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'aibao-gui-data'
          New-Item -ItemType Directory -Force -Path $env:HWLINEHELPER_HOME | Out-Null
          @{ auto_login = $true } | ConvertTo-Json |
            Set-Content (Join-Path $env:HWLINEHELPER_HOME 'shell-settings.json') -Encoding UTF8
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "app pid: $($proc.Id)"
          $ok = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { throw "App 啟動後自行結束 (exit $($proc.ExitCode)), 請看 shell.log" }
            try {
              $a = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3789/' -TimeoutSec 3
              $b = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3
              if ($a.StatusCode -eq 200 -and $b.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw 'App 啟動後 90 秒內引擎雙埠未就緒' }
          Start-Sleep -Seconds 5
          # 把主視窗移到畫面內並縮到 1000x700, 確保截圖拍得到完整視窗 (含頁尾版權宣告)
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win32Pos {
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr hAfter, int x, int y, int cx, int cy, uint flags);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@
          $proc.Refresh()
          if ($proc.MainWindowHandle -ne [IntPtr]::Zero) {
            [Win32Pos]::SetWindowPos($proc.MainWindowHandle, [IntPtr]::Zero, 10, 10, 1000, 700, 0x0040) | Out-Null
            [Win32Pos]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 2
          } else {
            Write-Host '警告: 找不到主視窗 handle, 截圖可能不完整'
          }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save((Join-Path $pwd 'app-main.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "screenshot saved: $((Get-Item app-main.png).Length) bytes"
          # 以第二實例 --quit 觸發結束序列 (明確指令路徑), 等主行程自行結束
          Start-Process -FilePath $exe -ArgumentList '--quit' -Wait
          $exited = $proc.WaitForExit(60000)
          Write-Host "app exited after --quit: $exited"
          if (-not $exited) { throw 'App 在 --quit 後 60 秒內未結束' }
          Start-Sleep -Seconds 2
          $still = $false
          try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3 | Out-Null; $still = $true } catch { }
          if ($still) { throw '結束後 helper 埠仍有回應 (引擎未確實結束)' }
          # 結束後存證: 殘留行程清單 + 雙埠探測結果寫進 artifact (2026-10-20「關掉 App 服務還在」缺失的加嚴驗證)
          $report = @()
          $remain = Get-Process | Where-Object { $_.ProcessName -in @('engine', 'AI寶') } | Select-Object Id, ProcessName
          if ($remain) { $report += ($remain | Format-Table | Out-String) } else { $report += 'residual_processes=none' }
          foreach ($p in 3789, 3790) {
            $c = Test-NetConnection -ComputerName 127.0.0.1 -Port $p -WarningAction SilentlyContinue
            $report += "port_${p}_tcp_connected=$($c.TcpTestSucceeded)"
          }
          $report | Set-Content (Join-Path $pwd 'gui-after-quit.txt')
          $report | Write-Host
          if ($remain) { throw '結束後仍有殘留引擎/App 行程' }
          Write-Host 'GUI 冒煙全數通過'

      - name: 外來佔用情境 — 假服務先佔雙埠, App 須偵測身分不符並提示, 且結束時不誤殺對方
        shell: pwsh
        run: |
          # 用 HttpListener 當「舊版/外來服務」: /api/status 回沒有 aibao-helper 身分標記的 JSON
          $stubScript = Join-Path $pwd 'foreign-stub.ps1'
          @'
          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://127.0.0.1:3789/")
          $listener.Prefixes.Add("http://127.0.0.1:3790/")
          $listener.Start()
          while ($listener.IsListening) {
            try { $ctx = $listener.GetContext() } catch { break }
            try {
              $body = [Text.Encoding]::UTF8.GetBytes('{"version":"stub-foreign","bot":null}')
              $ctx.Response.ContentType = "application/json"
              $ctx.Response.OutputStream.Write($body, 0, $body.Length)
              $ctx.Response.Close()
            } catch { }
          }
          '@ | Set-Content $stubScript -Encoding UTF8
          $stubProc = Start-Process pwsh -ArgumentList '-File', $stubScript -PassThru
          Start-Sleep -Seconds 3
          try {
            $s = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3
            if ($s.Content -match 'aibao-helper') { throw 'stub 不應帶身分標記, 情境設定錯誤' }
            Write-Host "stub 就緒: $($s.StatusCode) $($s.Content)"
            $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'aibao-foreign-data'
            # 本情境要驗「App 嘗試啟動引擎時撞到外來佔用」: 2026-10-22 起出廠預設不自動
            # 登入 (引擎不會自己啟動), 先預寫設定開啟 auto_login 才走得到這條路徑。
            New-Item -ItemType Directory -Force -Path $env:HWLINEHELPER_HOME | Out-Null
            @{ auto_login = $true } | ConvertTo-Json |
              Set-Content (Join-Path $env:HWLINEHELPER_HOME 'shell-settings.json') -Encoding UTF8
            $exe = (Resolve-Path 'out/AI寶.exe').Path
            $proc = Start-Process -FilePath $exe -PassThru
            $logPath = Join-Path $env:HWLINEHELPER_HOME 'logs\shell.log'
            $found = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              if ((Test-Path $logPath) -and ((Get-Content $logPath -Raw) -match '不明程式佔用')) { $found = $true; break }
              if ($proc.HasExited) { break }
            }
            if (Test-Path $logPath) { Copy-Item $logPath (Join-Path $pwd 'foreign-shell.log') }
            if (-not $found) { throw 'App 未偵測到外來佔用 (shell.log 沒有世代分類 Foreign 的紀錄)' }
            Write-Host 'App 已偵測外來佔用並留下紀錄'
            # 新預期 (2026-10-20 殘留定案): 埠上是不明程式時, 結束序列回 BlockedForeign —
            # App 不動對方、也不關窗假裝結束, 而是留在畫面顯示說明。驗: --quit 後 45 秒 App 仍在 + log 有 BlockedForeign。
            Start-Process -FilePath $exe -ArgumentList '--quit' -Wait
            $exited = $proc.WaitForExit(45000)
            if ($exited) { throw '外來情境: App 面對不明程式佔用時不應關窗離開 (應回 BlockedForeign 並留在畫面說明)' }
            Write-Host 'App 未關窗 (符合 BlockedForeign 預期)'
            Start-Sleep -Seconds 2
            $logNow = Get-Content $logPath -Raw
            if ($logNow -notmatch 'BlockedForeign') { throw '外來情境: shell.log 未見 BlockedForeign 結束結果' }
            Copy-Item $logPath (Join-Path $pwd 'foreign-shell.log') -Force
            Write-Host 'shell.log 已確認 BlockedForeign 紀錄; 情境收尾: 人工結束 App 行程 (它本來就不該自己關)'
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 2
            Write-Host '確認 stub 沒有被誤殺:'
            $s2 = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3
            if ($s2.StatusCode -ne 200) { throw '外來情境: stub 被誤殺 (對方行程不該被結束)' }
            Write-Host "stub 仍存活: $($s2.StatusCode)"
            Write-Host '外來佔用情境全數通過'
          } finally {
            if ($stubProc -and -not $stubProc.HasExited) { Stop-Process -Id $stubProc.Id -Force }
          }

      - name: 主題截圖 (五套主題各一張總覽頁)
        shell: pwsh
        run: |
          # 以預置 shell-settings.json 的 theme 逐套重啟 App: 證明已存主題在啟動
          # 第一幀即套用 (autostart 走同一條啟動路徑), 且五套色票實際渲染正確。
          # 每套用獨立資料目錄互不污染; 全螢幕截圖, 工作列一併入鏡。
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class U32T {
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          New-Item -ItemType Directory -Force -Path themes | Out-Null
          foreach ($t in @('forest','ocean','sakura','violet','mono')) {
            $home2 = Join-Path $env:RUNNER_TEMP "aibao-theme-$t"
            New-Item -ItemType Directory -Force -Path $home2 | Out-Null
            @{ show_window_on_start = $true; tray_hint_shown = $true; theme = $t; auto_login = $true } |
              ConvertTo-Json | Set-Content (Join-Path $home2 'shell-settings.json') -Encoding UTF8
            $env:HWLINEHELPER_HOME = $home2
            $proc = Start-Process 'out\AI寶.exe' -PassThru
            $up = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3790/api/status' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $up = $true; break }
              } catch {}
            }
            if (-not $up) { throw "theme ${t}: helper 3790 did not come up" }
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if ($proc.MainWindowHandle -ne 0) {
              [U32T]::SetWindowPos($proc.MainWindowHandle, [IntPtr]::Zero, 40, 30, 1000, 700, 0) | Out-Null
              [U32T]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
            }
            Start-Sleep -Seconds 3
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD "themes\theme-$t.png"))
            $g.Dispose(); $bmp.Dispose()
            & 'out\AI寶.exe' --quit | Out-Null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) { break }
            }
            if (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue) { throw "theme ${t}: app did not exit after --quit" }
            Write-Host "theme ${t}: screenshot saved"
          }
          Get-ChildItem themes | ForEach-Object { "shot: $($_.Name) $($_.Length) bytes" }

      - name: 聊天室畫面頁截圖 (未登入占位)
        shell: pwsh
        run: |
          # 以 AIBAO_START_PAGE=chat 直接停在「聊天室畫面」頁截圖: CI 沒有真 LINE 帳號可登入,
          # 此頁在未登入時應顯示白話占位 (登入後這裡會顯示聊天畫面) 而不是錯誤頁或崩潰;
          # WebView 真嵌入的渲染需登入狀態, 留待實機驗證 (本步驟同時證明含 wry 的成品能正常啟動/結束)。
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class U32C {
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          $home3 = Join-Path $env:RUNNER_TEMP "aibao-chatpage"
          New-Item -ItemType Directory -Force -Path $home3 | Out-Null
          @{ show_window_on_start = $true; tray_hint_shown = $true; theme = 'forest'; auto_login = $true } |
            ConvertTo-Json | Set-Content (Join-Path $home3 'shell-settings.json') -Encoding UTF8
          $env:HWLINEHELPER_HOME = $home3
          $env:AIBAO_START_PAGE = 'chat'
          $proc = Start-Process 'out\AI寶.exe' -PassThru
          $up = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3790/api/status' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $up = $true; break }
            } catch {}
          }
          if (-not $up) { throw "chat page: helper 3790 did not come up" }
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.MainWindowHandle -ne 0) {
            [U32C]::SetWindowPos($proc.MainWindowHandle, [IntPtr]::Zero, 40, 30, 1000, 700, 0) | Out-Null
            [U32C]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $PWD "app-chat.png"))
          $g.Dispose(); $bmp.Dispose()
          & 'out\AI寶.exe' --quit | Out-Null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) { break }
          }
          if (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue) { throw "chat page: app did not exit after --quit" }
          Remove-Item Env:AIBAO_START_PAGE
          Write-Host "chat page screenshot saved: $((Get-Item app-chat.png).Length) bytes"

      - name: GUI 回歸 — 閒置 3 分鐘無自發 stop/start 循環 + 單次重啟只准一對
        shell: pwsh
        run: |
          # 2026-10-22 實機事故回歸檢查: 舊版在真機出現 19 次 stop→start 機械循環
          # (QR 每次出現 1 秒就被結束序列砍掉, 永遠登入不了), 雲端探針全綠卻沒抓到 —
          # 因為探針只驗「有操作時的行為」, 沒驗「沒人碰它時會不會自己亂停」。
          # 本步: 自動登入開啟讓 App 自己啟動引擎, 然後完全不碰它觀察 3 分鐘,
          # shell.log 不得出現結束序列/被略過的要求, 監督者只准啟動 1 次;
          # 接著以 UI Automation 點「重新啟動引擎」一次, 只准出現一對 stop/start。
          $ErrorActionPreference = 'Stop'
          $idleHome = Join-Path $env:RUNNER_TEMP 'aibao-gui-idle'
          if (Test-Path $idleHome) { Remove-Item $idleHome -Recurse -Force }
          New-Item -ItemType Directory -Force $idleHome | Out-Null
          $env:HWLINEHELPER_HOME = $idleHome
          @{ schema = 1; theme = 'forest'; auto_login = $true; show_window_on_start = $true; tray_hint_shown = $true } |
            ConvertTo-Json | Set-Content (Join-Path $idleHome 'shell-settings.json') -Encoding utf8
          $shellLog = Join-Path $idleHome 'logs\shell.log'
          $result = @()
          function LogText {
            if (Test-Path $shellLog) { try { return (Get-Content $shellLog -Raw) } catch { return '' } }
            return ''
          }
          $p = Start-Process 'out\AI寶.exe' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(240)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ((LogText) -match '引擎監督者已啟動') { $ready = $true; break }
              Start-Sleep -Seconds 3
            }
            if (-not $ready) { throw '引擎未在 240 秒內啟動 (自動登入路徑)' }
            Start-Sleep -Seconds 180
            $idle = LogText
            $starts = ([regex]::Matches($idle, '引擎監督者已啟動')).Count
            if ($starts -ne 1) { throw "閒置觀察失敗: 監督者啟動次數應為 1, 實際 $starts" }
            if ($idle -match '結束序列階段') { throw '閒置觀察失敗: 無人操作卻出現結束序列 (stop/start 循環回歸)' }
            if ($idle -match '要求被略過') { throw '閒置觀察失敗: 有不明來源反覆觸發引擎操作 (出現被略過的要求)' }
            $result += 'idle-3min: PASS (監督者啟動 1 次, 無結束序列, 無被略過的要求)'
            Write-Host $result[-1]
            $clicked = $false
            try {
              Add-Type -AssemblyName UIAutomationClient
              Add-Type -AssemblyName UIAutomationTypes
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $pidCond = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
              $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $pidCond)
              if ($win) {
                $btnCond = New-Object System.Windows.Automation.PropertyCondition(
                  [System.Windows.Automation.AutomationElement]::NameProperty, '重新啟動引擎')
                $btn = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $btnCond)
                if ($btn) {
                  $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                  $clicked = $true
                }
              }
            } catch {
              $result += "single-restart: UIA 例外: $($_.Exception.Message)"
            }
            if ($clicked) {
              Start-Sleep -Seconds 45
              $after = LogText
              $begins = ([regex]::Matches($after, '重新啟動引擎開始')).Count
              $stops = ([regex]::Matches($after, '結束序列階段 1')).Count
              if ($begins -ne 1) { throw "單次重啟失敗: 「重新啟動引擎開始」應為 1 次, 實際 $begins" }
              if ($stops -ne 1) { throw "單次重啟失敗: 結束序列應為 1 次, 實際 $stops (單次操作被放大成多次)" }
              $result += 'single-restart: PASS (恰好一對 stop/start)'
              Write-Host $result[-1]
            } else {
              $result += 'single-restart: SKIPPED (UI Automation 找不到「重新啟動引擎」按鈕; 此部分未驗證)'
              Write-Host $result[-1]
            }
          } finally {
            if (-not $p.HasExited) {
              Start-Process 'out\AI寶.exe' -ArgumentList '--quit' | Out-Null
              $deadline = (Get-Date).AddSeconds(150)
              while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; throw 'App 未能在 --quit 後 150 秒內結束' }
            }
            if (Test-Path $shellLog) { Copy-Item $shellLog 'gui-idle-shell.log' -Force }
            $result | Set-Content 'gui-idle-result.txt' -Encoding utf8
          }

      - name: 逐頁截圖 — 每一頁都要入鏡 (修復版6 硬性驗證)
        shell: pwsh
        run: |
          # 修復版4/5 教訓: 有兩頁沒拍到截圖就交件, 老吳實機才發現問題。本步逐頁以
          # AIBAO_START_PAGE 指定起始頁重啟 App 截圖, 逐張存 artifact 供人工檢視;
          # 聊天室畫面頁另加 AIBAO_CHATVIEW_FORCE=1, 讓 WebView 真的嵌入核心頁
          # (未登入時是核心登入頁實景), 不再只拍未登入占位。聊天室管理頁先種入一筆
          # 假 chatProfiles, 讓編輯區有內容入鏡。缺任何一頁即整輪紅燈, 不准缺頁交件。
          $ErrorActionPreference = 'Stop'
          $pagesHome = Join-Path $env:RUNNER_TEMP 'aibao-pages-data'
          if (Test-Path $pagesHome) { Remove-Item $pagesHome -Recurse -Force }
          New-Item -ItemType Directory -Force $pagesHome | Out-Null
          New-Item -ItemType Directory -Force pages | Out-Null
          $env:HWLINEHELPER_HOME = $pagesHome
          @{ schema = 1; theme = 'forest'; auto_login = $true; show_window_on_start = $true; tray_hint_shown = $true } |
            ConvertTo-Json | Set-Content (Join-Path $pagesHome 'shell-settings.json') -Encoding utf8
          $exe = (Resolve-Path 'out/AI寶.exe').Path
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win32Pg {
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr hAfter, int x, int y, int cx, int cy, uint flags);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Save-Screen([string]$path) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $g.Dispose()
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "screenshot $path $((Get-Item $path).Length) bytes"
          }
          function Shot-App([string]$name, [hashtable]$extraEnv, [scriptblock]$whileUp = $null, [int[]]$scrollSteps = @()) {
            foreach ($k in $extraEnv.Keys) { Set-Item "env:$k" $extraEnv[$k] }
            $p = Start-Process -FilePath $exe -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(120)
              $up = $false
              while ((Get-Date) -lt $deadline) {
                if ($p.HasExited) { throw "pages/${name}: App 自行結束 (exit $($p.ExitCode))" }
                try {
                  $b = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3
                  if ($b.StatusCode -eq 200) { $up = $true; break }
                } catch { }
                Start-Sleep -Seconds 2
              }
              if (-not $up) { throw "pages/${name}: helper 120 秒未就緒" }
              if ($whileUp) { & $whileUp }
              Start-Sleep -Seconds 6
              $p.Refresh()
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
                [Win32Pg]::SetWindowPos($p.MainWindowHandle, [IntPtr]::Zero, 10, 10, 1000, 700, 0x0040) | Out-Null
                [Win32Pg]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
                Start-Sleep -Seconds 2
              }
              Save-Screen (Join-Path $PWD "pages\page-$name.png")
              # 捲動幀 (修復版6後續修復第二輪): CI 視窗 1000x700 只拍得到頁面上半,
              # 下方內容全在捲動下方, 上半頁截圖不能冒充全頁證據。步數為累計位置
              # (每 notch -120 = 內容上移、露出下方, 多幀覆蓋未知每 notch 捲動量)。
              $step = 0
              foreach ($n in $scrollSteps) {
                if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
                  [Win32Pg]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
                }
                [Win32Pg]::SetCursorPos(510, 360) | Out-Null
                # 滾輪向下 (-120 的 uint32 包裝值, 內容上移、露出下方); 直接寫 [uint32](-120)
                # 會被 PowerShell 範圍檢查擋下, 故寫已包裝好的正值 4294967176。
                $wheelDown = [uint32]4294967176
                for ($i = $step; $i -lt $n; $i++) {
                  [Win32Pg]::mouse_event(0x0800, 0, 0, $wheelDown, [UIntPtr]::Zero)
                  Start-Sleep -Milliseconds 100
                }
                $step = $n
                Start-Sleep -Seconds 2
                Save-Screen (Join-Path $PWD "pages\page-$name-s$n.png")
              }
            } finally {
              foreach ($k in $extraEnv.Keys) { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
              if (-not $p.HasExited) {
                Start-Process -FilePath $exe -ArgumentList '--quit' | Out-Null
                $dl = (Get-Date).AddSeconds(120)
                while (-not $p.HasExited -and (Get-Date) -lt $dl) { Start-Sleep -Seconds 2 }
                if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; throw "pages/${name}: --quit 後未結束" }
              }
              Start-Sleep -Seconds 2
            }
          }
          # 第一次啟動兼拍總覽; 趁這次啟動透過 helper API 種入一筆假 chatProfiles
          # (helper 只在有人存設定時才寫 settings.json, 全新啟動不會有檔案, 不能等檔案;
          # 用 GET->改->PUT 的控制台同款流程種入, 後續逐頁啟動都會讀到)。
          $seedAction = {
            $seedJs = Join-Path $pagesHome 'seed-settings.cjs'
          @'
          const http = require("http");
          function req(method, path, body) {
            return new Promise((resolve, reject) => {
              const data = body ? JSON.stringify(body) : null;
              const r = http.request(
                { host: "127.0.0.1", port: 3790, path, method, headers: data ? { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(data) } : {} },
                (res) => {
                  let buf = "";
                  res.on("data", (c) => (buf += c));
                  res.on("end", () => {
                    try { resolve(JSON.parse(buf)); } catch { resolve({}); }
                  });
                }
              );
              r.on("error", reject);
              if (data) r.write(data);
              r.end();
            });
          }
          (async () => {
            const s = await req("GET", "/api/settings");
            if (!s || typeof s !== "object" || !("botName" in s)) { console.error("seed: GET /api/settings shape unexpected"); process.exit(1); }
            s.ai = s.ai || {};
            s.ai.chatProfiles = s.ai.chatProfiles || {};
            s.ai.chatProfiles["c11111111111111111111111111111111"] = {
              rolePrompt: "（截圖驗證用）本群專屬角色",
              scopePrompt: "（截圖驗證用）只回答電腦與軟體問題",
              kbEnabled: true, kbFolder: "", chatty: true, personaCustom: true, suspended: false,
              admins: [{ id: "u22222222222222222222222222222222", name: "截圖驗證管理員" }],
            };
            // 修復版6後續修復: 第二個對照室 (值全部不同, 供 manage-b 截圖證明切換頁簽後表單跟著換)。
            s.ai.chatProfiles["c22222222222222222222222222222222"] = {
              rolePrompt: "（截圖驗證用）第二群專屬角色",
              scopePrompt: "（截圖驗證用）只回答財務問題",
              kbEnabled: false, kbFolder: "", chatty: false, personaCustom: true, suspended: false,
              admins: [{ id: "u33333333333333333333333333333333", name: "第二群管理員" }],
            };
            const res = await req("PUT", "/api/settings", s);
            if (!res || res.ok !== true) { console.error("seed: PUT /api/settings did not return ok"); process.exit(1); }
            const back = await req("GET", "/api/settings");
            const got = back && back.ai && back.ai.chatProfiles && back.ai.chatProfiles["c11111111111111111111111111111111"];
            if (!got || !Array.isArray(got.admins) || got.admins.length !== 1) { console.error("seed: read-back verification failed"); process.exit(1); }
            const got2 = back && back.ai && back.ai.chatProfiles && back.ai.chatProfiles["c22222222222222222222222222222222"];
            if (!got2 || !Array.isArray(got2.admins) || got2.admins.length !== 1) { console.error("seed: read-back verification failed (second room)"); process.exit(1); }
            console.log("seeded chatProfiles via API (read-back ok)");
          })().catch((e) => { console.error(e); process.exit(1); });
          '@ | Set-Content $seedJs -Encoding utf8
            node $seedJs
            if ($LASTEXITCODE -ne 0) { throw '逐頁截圖前置失敗: 種入假 chatProfiles 失敗' }
            Write-Host '已透過 API 種入假 chatProfiles (聊天室管理頁截圖用)'
          }
          Shot-App 'overview' @{} $seedAction @(5,10,20,35)
          # 總覽嵌入實景 (與聊天室畫面頁同一嵌入, 強制嵌入旗標讓未登入時也能拍到
          # 框內的核心登入頁, 證明總覽嵌入路徑會畫; 真登入後的總覽嵌入仍須真機驗收)。
          Shot-App 'overview-embed' @{ AIBAO_CHATVIEW_FORCE = '1' } -scrollSteps @(20,35)
          Shot-App 'chat' @{ AIBAO_START_PAGE = 'chat'; AIBAO_CHATVIEW_FORCE = '1' }
          Shot-App 'manage' @{ AIBAO_START_PAGE = 'manage' } -scrollSteps @(5,10,20,35)
          # 修復版6後續修復: 切換頁簽對照截圖——以 AIBAO_MANAGE_CHAT_ID 預選第二室,
          # 與上一張 manage 截圖 (預設第一室) 對照, 證明表單跟著頁簽換成該室存檔值。
          Shot-App 'manage-b' @{ AIBAO_START_PAGE = 'manage'; AIBAO_MANAGE_CHAT_ID = 'c22222222222222222222222222222222' } -scrollSteps @(20,35)
          # 選人器三幀 (Codex 對照驗收: 分頁＋搜尋＋已選清單)。種子室 c111 的已選管理員
          # 「截圖驗證管理員」由 manage_display_candidates 保證出現在候選名單內,
          # 不會誤觸未確認提醒。假候選人皆為 u9 開頭測試編號, 非真實帳號。
          Shot-App 'manage-picker' @{ AIBAO_START_PAGE = 'manage'; AIBAO_MANAGE_CANDIDATE_COUNT = '55' } -scrollSteps @(10,20,35,50)
          Shot-App 'manage-picker-p2' @{ AIBAO_START_PAGE = 'manage'; AIBAO_MANAGE_CANDIDATE_COUNT = '55'; AIBAO_MANAGE_PAGE = '2' } -scrollSteps @(35,50)
          Shot-App 'manage-picker-search' @{ AIBAO_START_PAGE = 'manage'; AIBAO_MANAGE_CANDIDATE_COUNT = '55'; AIBAO_MANAGE_SEARCH = '成員01' } -scrollSteps @(35,50)
          Shot-App 'send' @{ AIBAO_START_PAGE = 'send' }
          Shot-App 'ai' @{ AIBAO_START_PAGE = 'ai' }
          Shot-App 'bot' @{ AIBAO_START_PAGE = 'bot' }
          Shot-App 'kb' @{ AIBAO_START_PAGE = 'kb' }
          Shot-App 'scam' @{ AIBAO_START_PAGE = 'scam' }
          Shot-App 'logs' @{ AIBAO_START_PAGE = 'logs' }
          Shot-App 'appsettings' @{ AIBAO_START_PAGE = 'app' }
          Shot-App 'about' @{ AIBAO_START_PAGE = 'about' }
          # ---- 特殊態截圖 (修復版6後續修復第二輪: 總覽 Codex 化驗收) ----
          # 共用結束流程: --quit 走具名事件 (與 HOME 無關), 等不到才強制結束並報錯;
          # 被佔態例外: --quit 後 App 留在畫面是正確行為 (BlockedForeign 留窗),
          # Stop-ShotApp -Occupied 會主動結束行程收尾、不報錯 (run 40085637039 教訓:
          # 被佔截圖收尾預期 --quit 結束 App 導致整步紅燈、上傳被跳過)。
          # 被佔提示若等不到 Failed 落定, 只警告不紅燈 (雲端造不出條件時列未驗證)。
          function Stop-ShotApp([System.Diagnostics.Process]$p, [string]$name, [switch]$Occupied) {
            if (-not $p.HasExited) {
              Start-Process -FilePath $exe -ArgumentList '--quit' | Out-Null
              # 被佔態例外 (老吳定奪: 被佔用時按結束、視窗留在畫面才是正確行為):
              # 收尾絕不能預期 --quit 結束 App; 等 30 秒讓結束序列跑完留紀錄,
              # 再由流程主動結束行程, 不報錯。一般頁仍維持 120 秒等不到就報錯。
              $waitSecs = 120
              if ($Occupied) { $waitSecs = 30 }
              $dl = (Get-Date).AddSeconds($waitSecs)
              while (-not $p.HasExited -and (Get-Date) -lt $dl) { Start-Sleep -Seconds 2 }
              if (-not $p.HasExited) {
                Stop-Process -Id $p.Id -Force
                if ($Occupied) { Write-Host "pages/${name}: 被佔態 App 依舊留在畫面 (符合 BlockedForeign 留窗預期), 流程已主動結束行程收尾" }
                else { throw "pages/${name}: --quit 後未結束" }
              }
            }
            Start-Sleep -Seconds 2
          }
          function Shot-IdleOverview {
            # 未啟用占位態: 全新 HOME、auto_login=false, 引擎根本不啟動 — 不能沿用
            # Shot-App 的 helper-200 等待 (永遠等不到)。目標: 未啟用登入卡＋數字卡「—」
            # ＋服務列未取得＋目前情況「服務還沒啟動」提示＋嵌入框占位文字。
            $oldHome = $env:HWLINEHELPER_HOME
            $idleHome = Join-Path $env:RUNNER_TEMP 'aibao-idle-data'
            if (Test-Path $idleHome) { Remove-Item $idleHome -Recurse -Force }
            New-Item -ItemType Directory -Force $idleHome | Out-Null
            $env:HWLINEHELPER_HOME = $idleHome
            @{ schema = 1; theme = 'forest'; auto_login = $false; show_window_on_start = $true; tray_hint_shown = $true } |
              ConvertTo-Json | Set-Content (Join-Path $idleHome 'shell-settings.json') -Encoding utf8
            $p = Start-Process -FilePath $exe -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(120)
              $up = $false
              while ((Get-Date) -lt $deadline) {
                if ($p.HasExited) { throw "pages/overview-idle: App 自行結束 (exit $($p.ExitCode))" }
                $p.Refresh()
                if ($p.MainWindowHandle -ne [IntPtr]::Zero) { $up = $true; break }
                Start-Sleep -Seconds 2
              }
              if (-not $up) { throw "pages/overview-idle: 主視窗 120 秒未出現" }
              Start-Sleep -Seconds 6
              [Win32Pg]::SetWindowPos($p.MainWindowHandle, [IntPtr]::Zero, 10, 10, 1000, 700, 0x0040) | Out-Null
              [Win32Pg]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 2
              Save-Screen (Join-Path $PWD "pages\page-overview-idle.png")
            } finally {
              Stop-ShotApp $p 'overview-idle'
              $env:HWLINEHELPER_HOME = $oldHome
            }
          }
          function Shot-CustomPorts {
            # 自訂連接埠管線: shell-settings 寫 core_port=3811/helper_port=3812 後啟動,
            # 等控制台在自訂埠回 200 (不可沿用 3790 等待)。目標: 證明設定→啟動 env→
            # 引擎監聽→殼以新埠通訊整條鏈路 (Running 狀態)。此步證明管線, 不證明點按換埠
            # (CI 無滑鼠點按自動化; 點按換埠端到端以真機驗收為準)。
            $oldHome = $env:HWLINEHELPER_HOME
            $customHome = Join-Path $env:RUNNER_TEMP 'aibao-customports-data'
            if (Test-Path $customHome) { Remove-Item $customHome -Recurse -Force }
            New-Item -ItemType Directory -Force $customHome | Out-Null
            $env:HWLINEHELPER_HOME = $customHome
            @{ schema = 1; theme = 'forest'; auto_login = $true; show_window_on_start = $true; tray_hint_shown = $true; core_port = 3811; helper_port = 3812 } |
              ConvertTo-Json | Set-Content (Join-Path $customHome 'shell-settings.json') -Encoding utf8
            $p = Start-Process -FilePath $exe -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(120)
              $up = $false
              while ((Get-Date) -lt $deadline) {
                if ($p.HasExited) { throw "pages/overview-customports: App 自行結束 (exit $($p.ExitCode))" }
                try {
                  $b = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3812/api/status' -TimeoutSec 3
                  if ($b.StatusCode -eq 200) { $up = $true; break }
                } catch { }
                Start-Sleep -Seconds 2
              }
              if (-not $up) { throw "pages/overview-customports: 控制台在自訂埠 3812 上 120 秒未就緒" }
              Start-Sleep -Seconds 6
              $p.Refresh()
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
                [Win32Pg]::SetWindowPos($p.MainWindowHandle, [IntPtr]::Zero, 10, 10, 1000, 700, 0x0040) | Out-Null
                [Win32Pg]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
                Start-Sleep -Seconds 2
              }
              Save-Screen (Join-Path $PWD "pages\page-overview-customports.png")
            } finally {
              Stop-ShotApp $p 'overview-customports'
              $env:HWLINEHELPER_HOME = $oldHome
            }
          }
          function Shot-OccupiedPorts {
            # 連接埠被佔提示: 先以假服務佔住 3789/3790 (任意 HTTP 回應即可, 監督者探測
            # 只認有回應; 非 AI寶 身分即歸 Foreign)。目標: 情況區上方出現被佔提示＋
            # 「改用空閒連接埠」鈕。等不到 Failed 落定只警告、不紅燈。
            $oldHome = $env:HWLINEHELPER_HOME
            $occHome = Join-Path $env:RUNNER_TEMP 'aibao-occupied-data'
            if (Test-Path $occHome) { Remove-Item $occHome -Recurse -Force }
            New-Item -ItemType Directory -Force $occHome | Out-Null
            $occJs = Join-Path $occHome 'occupier.cjs'
            # 注意: 不用 here-string 寫這支 JS——YAML 剝掉共用縮排後, 函式內層的結尾
            # '@ 前會殘留空白, PowerShell 解析直接報錯、整段截圖步驟連跑都沒跑
            # (run 40084691090 即因此失敗)。改以單引號字串陣列接合寫檔。
            @(
              'const http = require("http");',
              'for (const port of [3789, 3790]) {',
              '  http.createServer((req, res) => { res.writeHead(200, { "Content-Type": "text/plain" }); res.end("not-aibao"); }).listen(port, "127.0.0.1");',
              '}'
            ) -join "`n" | Set-Content $occJs -Encoding utf8
            $occ = Start-Process -FilePath 'node' -ArgumentList $occJs -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(30)
              $occUp = $false
              while ((Get-Date) -lt $deadline) {
                try {
                  $b = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3789/' -TimeoutSec 3
                  if ($b.StatusCode -eq 200) { $occUp = $true; break }
                } catch { }
                Start-Sleep -Seconds 2
              }
              if (-not $occUp) { Write-Warning "pages/overview-occupied: 假佔用服務 30 秒未回應, 仍繼續 (提示可能拍不到)" }
              $env:HWLINEHELPER_HOME = $occHome
              @{ schema = 1; theme = 'forest'; auto_login = $true; show_window_on_start = $true; tray_hint_shown = $true } |
                ConvertTo-Json | Set-Content (Join-Path $occHome 'shell-settings.json') -Encoding utf8
              $p = Start-Process -FilePath $exe -PassThru
              try {
                $deadline = (Get-Date).AddSeconds(120)
                $up = $false
                while ((Get-Date) -lt $deadline) {
                  if ($p.HasExited) { throw "pages/overview-occupied: App 自行結束 (exit $($p.ExitCode))" }
                  $p.Refresh()
                  if ($p.MainWindowHandle -ne [IntPtr]::Zero) { $up = $true; break }
                  Start-Sleep -Seconds 2
                }
                if (-not $up) { throw "pages/overview-occupied: 主視窗 120 秒未出現" }
                [Win32Pg]::SetWindowPos($p.MainWindowHandle, [IntPtr]::Zero, 10, 10, 1000, 700, 0x0040) | Out-Null
                [Win32Pg]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
                # 等 Failed 落定 (App 日誌出現佔用字樣) 再拍, 避免拍到啟動中途;
                # 90 秒等不到只警告、不紅燈, 截圖仍拍 (屆時狀態以圖為準)。
                $logPath = Join-Path $occHome 'logs\shell.log'
                $dl2 = (Get-Date).AddSeconds(90)
                $settled = $false
                while ((Get-Date) -lt $dl2) {
                  if ((Test-Path $logPath) -and (Select-String -Path $logPath -Pattern '佔用' -Quiet)) { $settled = $true; break }
                  Start-Sleep -Seconds 2
                }
                if (-not $settled) { Write-Warning "pages/overview-occupied: 90 秒未見佔用落定紀錄, 截圖狀態以圖為準" }
                Start-Sleep -Seconds 2
                Save-Screen (Join-Path $PWD "pages\page-overview-occupied.png")
              } finally {
                Stop-ShotApp $p 'overview-occupied' -Occupied
              }
            } finally {
              if (-not $occ.HasExited) { Stop-Process -Id $occ.Id -Force }
              $env:HWLINEHELPER_HOME = $oldHome
            }
          }
          Shot-IdleOverview
          Shot-CustomPorts
          Shot-OccupiedPorts
          Get-ChildItem pages | ForEach-Object { "shot: $($_.Name) $($_.Length) bytes" }

      - name: 上傳成品、探針結果、截圖與 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aibao-app
          path: |
            out/AI寶.exe
            probe-result.txt
            probe-stdout.txt
            probe-stderr.txt
            app-main.png
            app-chat.png
            gui-after-quit.txt
            gui-idle-result.txt
            gui-idle-shell.log
            foreign-shell.log
            themes/theme-*.png
            pages/page-*.png
          if-no-files-found: warn

  # 舊世代建置 (結束殘留情境的前置): 歷史定版各自建出當代產物 —
  # gen-0 = 4a54c35 網頁版世代引擎 (無 stop-request、helper 無身分標記),
  # gen-1 = 1314fb3 第一代殼的引擎 payload,
  # prev = d45de3b 上一支已交付建置的引擎 (有身分標記、戳記與新殼不同, 情境 E 用),
  # gen-2 殼 = 8ca33d1 第二代殼 App (就是被老吳實機抓到「結束沒清掉服務」的那代),
  # gen-3 殼 = a27b76c 引用續答版殼 (版本戳記修前最後一版, 情境 D/E 紅燈用)。
  build-legacy:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: 取出原始碼 (完整歷史, 情境要 checkout 歷史定版)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 設定 Rust 工具鏈
        uses: dtolnay/rust-toolchain@stable

      - name: 建置歷史定版 (gen-0/gen-1/prev 引擎、gen-2/gen-3 殼)
        shell: pwsh
        run: |
          $legacy = Join-Path $env:RUNNER_TEMP 'legacy'
          New-Item -ItemType Directory -Force $legacy | Out-Null
          function Build-EngineAt([string]$ref, [string]$outName) {
            git checkout $ref
            if ($LASTEXITCODE -ne 0) { throw "checkout $ref 失敗" }
            npm ci --include=dev
            npm run build
            Push-Location helper
            npm ci
            Pop-Location
            Push-Location pack
            npm ci
            Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
            node build.mjs --target win --skip-core-build
            Pop-Location
            $built = Join-Path $pwd 'pack/out/AI寶.exe'
            if (-not (Test-Path $built)) { throw "$ref 引擎建置未產出 exe" }
            Copy-Item $built (Join-Path $legacy $outName)
            Write-Host "$outName built: $((Get-Item (Join-Path $legacy $outName)).Length) bytes"
          }
          # gen-0: 網頁版世代 (4a54c35)
          Build-EngineAt '4a54c35f92d05540745522e27cd3b47b0889e9de' 'gen0-engine.exe'
          # gen-1: 第一代殼世代的引擎 payload (1314fb3)
          Build-EngineAt '1314fb3259d950d133d0b1bba642b7a168f33323' 'gen1-engine.exe'
          # prev: 上一支已交付建置 (d45de3b, run 39396215897) 的引擎 — helper 有 service 標記、
          # 白名單端點其實存在, 但引擎目錄戳記與新殼不同; 情境 E 專驗「標記相同、建置不同」
          # 不得被當同版收編 (老吳實機白名單 404 的機制)。
          Build-EngineAt 'd45de3b94a35c7267023d69644cc6a6a55627ea7' 'prev-engine.exe'
          # gen-2 / gen-3 殼: 歷史 App 本體 (各自內嵌當代引擎)。
          # gen-2 = 8ca33d1 (被實機抓到「結束沒清掉服務」的那代);
          # gen-3 = a27b76c (引用續答版, 本批「探測跨界誤判 Foreign」修前的最後一版, 情境 D 紅燈用)。
          function Build-AppAt([string]$ref, [string]$outName) {
            git checkout $ref
            if ($LASTEXITCODE -ne 0) { throw "checkout $ref 失敗" }
            npm ci --include=dev
            npm run build
            Push-Location helper
            npm ci
            Pop-Location
            Push-Location pack
            npm ci
            Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
            node build.mjs --target win --skip-core-build
            Pop-Location
            New-Item -ItemType Directory -Force app/payload | Out-Null
            Copy-Item 'pack/out/AI寶.exe' app/payload/engine.exe
            Push-Location app
            cargo build --release
            Pop-Location
            $appBuilt = Join-Path $pwd 'app/target/release/aibao-app.exe'
            if (-not (Test-Path $appBuilt)) { throw "$ref 殼建置未產出 exe" }
            Copy-Item $appBuilt (Join-Path $legacy $outName)
            Write-Host "$outName built: $((Get-Item (Join-Path $legacy $outName)).Length) bytes"
          }
          Build-AppAt '8ca33d15ea3be900d774e21e90a3c6f0a1fc87ab' 'app-gen2.exe'
          Build-AppAt 'a27b76c3062b0f91107423c5761a86dbd42bbcc4' 'app-gen3.exe'

      - name: 上傳舊世代產物
        uses: actions/upload-artifact@v4
        with:
          name: legacy-engines
          path: |
            ${{ runner.temp }}/legacy/gen0-engine.exe
            ${{ runner.temp }}/legacy/gen1-engine.exe
            ${{ runner.temp }}/legacy/prev-engine.exe
            ${{ runner.temp }}/legacy/app-gen2.exe
            ${{ runner.temp }}/legacy/app-gen3.exe
          retention-days: 1

  # 結束殘留情境 (2026-10-20 老吳實機「關掉 App 服務還在」的加嚴驗證):
  # (a) 舊世代殘留 × 舊殼 (gen-2) = 紅燈重現: 舊殼結束後服務必須仍在 (證明情境抓得到原 bug);
  # (b) gen-0 殘留 × 新殼: 新殼啟動時收編清除舊殘留、換上目前世代引擎, 結束後雙埠釋放且無殘留行程;
  # (c) gen-1 殘留 × 新殼: 同 (b);
  # (d) 探測跨界 (helper 回應不完整) × 舊殼紅燈 / 新殼綠燈;
  # (e) 建置版本戳記: 上一建置 (prev) stack × gen-3 殼 = 誤收編紅燈; × 新殼 = 戳記不符清除換版綠燈。
  legacy-scenarios:
    needs: [build-app, build-legacy]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 下載新版 App 與舊世代產物
        uses: actions/download-artifact@v4
        with:
          name: aibao-app
          path: dl-app

      - name: 下載舊世代產物 (續)
        uses: actions/download-artifact@v4
        with:
          name: legacy-engines
          path: dl-legacy

      - name: 殘留情境五組
        shell: pwsh
        run: |
          $newApp = (Resolve-Path 'dl-app/out/AI寶.exe').Path
          $gen0 = (Resolve-Path 'dl-legacy/gen0-engine.exe').Path
          $gen1 = (Resolve-Path 'dl-legacy/gen1-engine.exe').Path
          $prev = (Resolve-Path 'dl-legacy/prev-engine.exe').Path
          $gen2 = (Resolve-Path 'dl-legacy/app-gen2.exe').Path
          $gen3 = (Resolve-Path 'dl-legacy/app-gen3.exe').Path
          $ev = Join-Path $pwd 'legacy-evidence'
          New-Item -ItemType Directory -Force $ev | Out-Null

          function Test-Http([string]$u) {
            try { Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 3 | Out-Null; return $true }
            catch { return [bool]$_.Exception.Response }
          }
          function Wait-ServicesUp([int]$secs) {
            $dl = (Get-Date).AddSeconds($secs)
            while ((Get-Date) -lt $dl) {
              if ((Test-Http 'http://127.0.0.1:3789/') -and (Test-Http 'http://127.0.0.1:3790/api/status')) { return $true }
              Start-Sleep -Seconds 2
            }
            return $false
          }
          function Wait-PortsFree([int]$secs) {
            $dl = (Get-Date).AddSeconds($secs)
            while ((Get-Date) -lt $dl) {
              if (-not (Test-Http 'http://127.0.0.1:3789/') -and -not (Test-Http 'http://127.0.0.1:3790/api/status')) { return $true }
              Start-Sleep -Seconds 2
            }
            return $false
          }
          function Wait-IdentityCurrent([int]$secs) {
            $dl = (Get-Date).AddSeconds($secs)
            while ((Get-Date) -lt $dl) {
              try {
                $s = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/status' -TimeoutSec 3
                if ($s.Content -match 'aibao-helper') { return $true }
              } catch { }
              Start-Sleep -Seconds 2
            }
            return $false
          }
          function Get-ImagePids([string]$path) {
            @(Get-Process | Where-Object { try { $_.Path -eq $path } catch { $false } } | Select-Object -ExpandProperty Id)
          }
          function Kill-Image([string]$path) {
            Get-ImagePids $path | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          }
          function Seed-AutoLogin([string]$dataHome) {
            # 2026-10-22 問題 6 修復後, 新殼出廠預設「開啟程式不自動登入」 (引擎不啟動);
            # 本 job 用新殼的情境 (b/c/d-green/e-green) 都預期殼一啟動就接手管理引擎,
            # 先在該情境的資料目錄預寫 shell-settings.json 開啟 auto_login。
            # 舊殼情境 (a/d-red/e-red) 不呼叫此函式, 維持原始前提。
            New-Item -ItemType Directory -Force -Path $dataHome | Out-Null
            @{ auto_login = $true } | ConvertTo-Json |
              Set-Content (Join-Path $dataHome 'shell-settings.json') -Encoding UTF8
          }
          function Get-NewEnginePids([string]$dataHome) {
            # 新殼自己啟動的引擎會解在 $dataHome\engine\<戳記>\engine.exe; prev 等外來路徑不算。
            # (參數不可用 $home: 那是 PowerShell 唯讀自動變數, 會直接 WriteError — CI 首跑實證。)
            $prefix = Join-Path $dataHome 'engine'
            @(Get-Process | Where-Object { try { $_.Path -like "$prefix\*\engine.exe" } catch { $false } } | Select-Object -ExpandProperty Id)
          }

          # ---------- 情境 (a): 舊世代殘留 × 舊殼 (gen-2) = 紅燈重現 ----------
          Write-Host '=== 情境 (a): gen-0 殘留 × 舊殼 — 預期舊殼結束後服務仍殘留 (重現原 bug) ==='
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenA-data'
          $supA = Start-Process $gen0 -PassThru
          if (-not (Wait-ServicesUp 150)) { throw '情境A: gen-0 引擎 150 秒未就緒' }
          Write-Host '情境A: gen-0 服務已就緒'
          $oldApp = Start-Process $gen2 -PassThru
          Start-Sleep -Seconds 25
          Start-Process $gen2 -ArgumentList '--quit' -Wait
          $exitedA = $oldApp.WaitForExit(120000)
          Start-Sleep -Seconds 2
          $residueA = (Test-Http 'http://127.0.0.1:3790/api/status') -or (Test-Http 'http://127.0.0.1:3789/')
          @("scenario=a_old_shell_vs_gen0_residue", "old_app_exited=$exitedA", "residue_present=$residueA") | Set-Content (Join-Path $ev 'legacy-a.txt')
          @("scenario=a_old_shell_vs_gen0_residue", "old_app_exited=$exitedA", "residue_present=$residueA") | Write-Host
          if (-not $exitedA) { throw '情境A: 舊殼 120 秒未結束, 情境無法判定' }
          if (-not $residueA) { throw '情境A: 紅燈重現失敗 — 舊殼結束後殘留應仍存在; 若不存在代表前提改變, 需人工複查' }
          Write-Host '情境A: 紅燈重現成立 (舊殼回報結束、服務仍在) — 清場'
          Kill-Image $gen0
          Kill-Image $gen2
          if (-not (Wait-PortsFree 60)) { throw '情境A: 清場後埠未釋放' }

          # ---------- 情境 (b): gen-0 殘留 × 新殼 ----------
          Write-Host '=== 情境 (b): gen-0 殘留 × 新殼 — 預期收編清除 + 結束後清乾淨 ==='
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenB-data'
          Seed-AutoLogin $env:HWLINEHELPER_HOME
          $supB = Start-Process $gen0 -PassThru
          if (-not (Wait-ServicesUp 150)) { throw '情境B: gen-0 引擎 150 秒未就緒' }
          $appB = Start-Process $newApp -PassThru
          if (-not (Wait-IdentityCurrent 240)) { throw '情境B: 新殼未在 240 秒內把舊世代服務換成目前世代引擎' }
          Write-Host '情境B: 新殼已收編清除舊殘留並啟動目前世代引擎'
          Start-Process $newApp -ArgumentList '--quit' -Wait
          $exitedB = $appB.WaitForExit(120000)
          $freeB = Wait-PortsFree 30
          $gen0Left = @(Get-ImagePids $gen0).Count
          @("scenario=b_new_shell_vs_gen0_residue", "app_exited=$exitedB", "ports_free=$freeB", "gen0_pids_left=$gen0Left", "cleanup_ok=$($exitedB -and $freeB -and $gen0Left -eq 0)") | Set-Content (Join-Path $ev 'legacy-b.txt')
          @("scenario=b_new_shell_vs_gen0_residue", "app_exited=$exitedB", "ports_free=$freeB", "gen0_pids_left=$gen0Left") | Write-Host
          if (-not ($exitedB -and $freeB -and $gen0Left -eq 0)) { throw '情境B: 新殼未把 gen-0 殘留清乾淨' }
          Write-Host '情境B: 通過'

          # ---------- 情境 (c): gen-1 殘留 × 新殼 ----------
          Write-Host '=== 情境 (c): gen-1 殘留 × 新殼 — 預期收編清除 + 結束後清乾淨 ==='
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenC-data'
          Seed-AutoLogin $env:HWLINEHELPER_HOME
          $supC = Start-Process $gen1 -PassThru
          if (-not (Wait-ServicesUp 150)) { throw '情境C: gen-1 引擎 150 秒未就緒' }
          $appC = Start-Process $newApp -PassThru
          if (-not (Wait-IdentityCurrent 240)) { throw '情境C: 新殼未在 240 秒內把舊世代服務換成目前世代引擎' }
          Write-Host '情境C: 新殼已收編清除舊殘留並啟動目前世代引擎'
          Start-Process $newApp -ArgumentList '--quit' -Wait
          $exitedC = $appC.WaitForExit(120000)
          $freeC = Wait-PortsFree 30
          $gen1Left = @(Get-ImagePids $gen1).Count
          @("scenario=c_new_shell_vs_gen1_residue", "app_exited=$exitedC", "ports_free=$freeC", "gen1_pids_left=$gen1Left", "cleanup_ok=$($exitedC -and $freeC -and $gen1Left -eq 0)") | Set-Content (Join-Path $ev 'legacy-c.txt')
          @("scenario=c_new_shell_vs_gen1_residue", "app_exited=$exitedC", "ports_free=$freeC", "gen1_pids_left=$gen1Left") | Write-Host
          if (-not ($exitedC -and $freeC -and $gen1Left -eq 0)) { throw '情境C: 新殼未把 gen-1 殘留清乾淨' }
          Write-Host '情境C: 通過'

          # ---------- 情境 (d): 探測跨界 — helper 回應不完整 (模擬 KB 掃描堵塞事件迴圈) ----------
          # 2026-10-20 老吳實機定案之三: 自家 stack 正常服務, 殼卻判 Foreign 鎖死異常停止。
          # 機制: 舊 classify 對「body 讀不到 (逾時) 但 status 探得到」直接判 Foreign, 而 helper 被
          # 知識庫掃描堵塞時, 一次探測正好跨在堵塞結束前後就會命中; 之後 Failed 永不重探、鎖死。
          # stub: 3789 立刻回正常 HTML; 3790 前 7 秒只送 HTTP 標頭 + 部分 body 就 hold 住連線
          # (讀 body 必逾時、status 探測卻成功 — 正是跨界形狀), 7 秒後改回完整正確的身分 JSON。
          # (d-red) 舊殼 (gen-3, 修前版): 預期被判 Foreign 並在 shell.log 留下鎖死紀錄 (紅燈重現)。
          # (d-green) 新殼: 預期探測顯示「身分未定」並重試, 身分確認後接手 (ExternalRunning),
          #           不得出現 Foreign 定案; 之後 --quit 要能把 stub (模擬自家 stack) 清掉並結束。
          $stubD = Join-Path $pwd 'flap-stub.ps1'
          @'
          $l1 = New-Object System.Net.Sockets.TcpListener ([System.Net.IPAddress]::Parse("127.0.0.1")), 3789
          $l2 = New-Object System.Net.Sockets.TcpListener ([System.Net.IPAddress]::Parse("127.0.0.1")), 3790
          $l1.Start(); $l2.Start()
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $html = "<!doctype html><html><head><title>LINE.js</title></head><body>stub core</body></html>"
          $json = '{"service":"aibao-helper","version":"stub","capabilities":["list-models","line-config","token-gen"],"bot":{"connected":false,"botConnected":false,"lineState":"stub"}}'
          $held = New-Object System.Collections.ArrayList
          function Send-Full($client, $body, $ctype) {
            try {
              $s = $client.GetStream()
              try { $buf = New-Object byte[] 4096; $client.ReceiveTimeout = 200; $null = $s.Read($buf, 0, $buf.Length) } catch { }
              $bytes = [Text.Encoding]::UTF8.GetBytes($body)
              $head = [Text.Encoding]::ASCII.GetBytes("HTTP/1.1 200 OK`r`nContent-Type: $ctype`r`nContent-Length: $($bytes.Length)`r`nConnection: close`r`n`r`n")
              $s.Write($head, 0, $head.Length); $s.Write($bytes, 0, $bytes.Length); $s.Flush()
            } catch { }
            try { $client.Close() } catch { }
          }
          function Send-Partial($client) {
            try {
              $s = $client.GetStream()
              try { $buf = New-Object byte[] 4096; $client.ReceiveTimeout = 200; $null = $s.Read($buf, 0, $buf.Length) } catch { }
              $part = [Text.Encoding]::UTF8.GetBytes('{"service":"aibao-helper","vers')
              $head = [Text.Encoding]::ASCII.GetBytes("HTTP/1.1 200 OK`r`nContent-Type: application/json`r`nContent-Length: 500`r`n`r`n")
              $s.Write($head, 0, $head.Length); $s.Write($part, 0, $part.Length); $s.Flush()
              $null = $held.Add($client)
            } catch { }
          }
          while ($true) {
            if ($l1.Pending()) { Send-Full ($l1.AcceptTcpClient()) $html "text/html; charset=utf-8" }
            if ($l2.Pending()) {
              $c = $l2.AcceptTcpClient()
              if ($sw.Elapsed.TotalSeconds -lt 7) { Send-Partial $c } else { Send-Full $c $json "application/json" }
            }
            if ($sw.Elapsed.TotalSeconds -ge 7) { foreach ($h in @($held)) { try { $h.Close() } catch { } }; $held.Clear() }
            Start-Sleep -Milliseconds 100
          }
          '@ | Set-Content $stubD -Encoding UTF8

          Write-Host '=== 情境 (d-red): 探測跨界 × 舊殼 (gen-3) — 預期誤判 Foreign 鎖死 (紅燈重現) ==='
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenDred-data'
          $stubProcD = Start-Process pwsh -ArgumentList '-File', $stubD -PassThru
          Start-Sleep -Seconds 2
          $appDred = Start-Process $gen3 -PassThru
          $logDred = Join-Path $env:HWLINEHELPER_HOME 'logs\shell.log'
          $lockedD = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            if ((Test-Path $logDred) -and ((Get-Content $logDred -Raw) -match '不明程式佔用')) { $lockedD = $true; break }
          }
          @("scenario=d_old_shell_probe_straddle", "foreign_locked=$lockedD") | Set-Content (Join-Path $ev 'legacy-d-red.txt')
          @("scenario=d_old_shell_probe_straddle", "foreign_locked=$lockedD") | Write-Host
          if (-not $lockedD) { throw '情境D-red: 紅燈重現失敗 — 舊殼在探測跨界下應誤判 Foreign 鎖死; 若未發生代表前提改變, 需人工複查' }
          Write-Host '情境D-red: 紅燈重現成立 (舊殼誤判 Foreign) — 清場'
          Kill-Image $gen3
          if ($stubProcD -and -not $stubProcD.HasExited) { Stop-Process -Id $stubProcD.Id -Force }
          Start-Sleep -Seconds 2
          if (-not (Wait-PortsFree 60)) { throw '情境D-red: 清場後埠未釋放' }

          Write-Host '=== 情境 (d-green): 探測跨界 × 新殼 (--autostart 冷開機路徑) — 預期身分未定重試後接手, 不得判 Foreign ==='
          # 用 --autostart 啟動: 開機自啟動是老吳追加的正式驗收項; --autostart 與雙擊共用同一套
          # 引擎啟動/探測邏輯, --autostart 只改視窗隱藏; 2026-10-22 問題 6 修復後引擎啟動
          # 改由 auto_login 設定決定 (出廠預設關閉), 本情境已預寫 auto_login=true (見下
          # Seed-AutoLogin), 在此以自啟動路徑覆蓋「開機時系統忙碌、helper 回應慢」的冷開機時序。
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenD-data'
          Seed-AutoLogin $env:HWLINEHELPER_HOME
          $stubProcD2 = Start-Process pwsh -ArgumentList '-File', $stubD -PassThru
          Start-Sleep -Seconds 2
          $appD = Start-Process $newApp -ArgumentList '--autostart' -PassThru
          $logD = Join-Path $env:HWLINEHELPER_HOME 'logs\shell.log'
          $adoptedD = $false; $flapSeenD = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if (Test-Path $logD) {
              $txt = Get-Content $logD -Raw
              if ($txt -match '身分未定') { $flapSeenD = $true }
              if ($txt -match '接手顯示狀態') { $adoptedD = $true; break }
            }
          }
          $logDTxt = if (Test-Path $logD) { Get-Content $logD -Raw } else { '' }
          $foreignD = $logDTxt -match '多輪確認後定案'
          if (-not $adoptedD) { throw '情境D-green: 新殼未在時限內認出身分並接手 (ExternalRunning)' }
          if ($foreignD) { throw '情境D-green: 新殼仍出現 Foreign 定案, 修復未生效' }
          Write-Host "情境D-green: 已接手 (身分未定重試出現=$flapSeenD) — 驗證結束路徑"
          Start-Process $newApp -ArgumentList '--quit' -Wait
          $exitedD = $appD.WaitForExit(120000)
          $freeD = Wait-PortsFree 30
          @("scenario=d_new_shell_probe_straddle", "launch=--autostart", "flapping_seen=$flapSeenD", "foreign_locked=$foreignD", "adopted=$adoptedD", "app_exited=$exitedD", "ports_free=$freeD", "cleanup_ok=$($exitedD -and $freeD)") | Set-Content (Join-Path $ev 'legacy-d.txt')
          @("scenario=d_new_shell_probe_straddle", "flapping_seen=$flapSeenD", "foreign_locked=$foreignD", "adopted=$adoptedD", "app_exited=$exitedD", "ports_free=$freeD") | Write-Host
          if ($stubProcD2 -and -not $stubProcD2.HasExited) { Stop-Process -Id $stubProcD2.Id -Force }
          if (-not ($exitedD -and $freeD)) { throw '情境D-green: 新殼結束後埠未釋放或 App 未結束' }
          Write-Host '情境D: 通過'

          # ---------- 情境 (e): 建置版本戳記 — 不同建置的自家 stack 不得被當同版收編 ----------
          # 2026-10-20 老吳實機定案之四: 他裝的新版殼在 classify 只驗 service 標記、不驗建置,
          # 把前一支已交付建置 (d45de3b 之前的世代) 的 stack 誤當目前世代收編使用; 該世代
          # helper 沒有新端點 → 白名單 GET /api/line/whitelist 實機 404 (CI 探針對新版實打
          # 卻全 ok, 因為探針打的是新殼自己啟的同版 stack)。prev = d45de3b 的引擎: helper
          # 有 service 標記、白名單端點其實存在, 但引擎目錄戳記 (ENGINE_ID) 與新殼不同 —
          # 正是「標記相同、建置不同」的形狀。
          # (e-red) gen-3 殼 (戳記修前版): 只看標記 → 預期誤收編 prev stack (shell.log 出現
          #           「接手顯示狀態」且 prev 引擎仍在跑) = 紅燈重現。
          # (e-green) 新殼: 預期 shell.log 出現「版本戳記不符」、prev 引擎被清除、改啟動自己
          #           建置的引擎 (資料目錄 engine\<戳記>\engine.exe), 白名單端點實打 200;
          #           --quit 後雙埠釋放。此綠燈同時是「一鍵修復」共用路徑 (stop 舊世代 +
          #           start 自家引擎) 的情境證據。
          Write-Host '=== 情境 (e-red): 上一建置 stack × gen-3 殼 — 預期誤收編 (紅燈重現) ==='
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenEred-data'
          $supEred = Start-Process $prev -PassThru
          if (-not (Wait-ServicesUp 150)) { throw '情境E-red: prev 引擎 150 秒未就緒' }
          $appEred = Start-Process $gen3 -PassThru
          $logEred = Join-Path $env:HWLINEHELPER_HOME 'logs\shell.log'
          $adoptedEred = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            if ((Test-Path $logEred) -and ((Get-Content $logEred -Raw) -match '接手顯示狀態')) { $adoptedEred = $true; break }
          }
          $prevAliveEred = @(Get-ImagePids $prev).Count
          @("scenario=e_old_shell_adopts_prev_build", "adopted=$adoptedEred", "prev_pids_alive=$prevAliveEred") | Set-Content (Join-Path $ev 'legacy-e-red.txt')
          @("scenario=e_old_shell_adopts_prev_build", "adopted=$adoptedEred", "prev_pids_alive=$prevAliveEred") | Write-Host
          if (-not ($adoptedEred -and $prevAliveEred -gt 0)) { throw '情境E-red: 紅燈重現失敗 — gen-3 殼應誤收編 prev 建置 stack; 若未發生代表前提改變, 需人工複查' }
          Write-Host '情境E-red: 紅燈重現成立 (舊殼只看標記、誤收編不同建置) — 清場'
          Kill-Image $gen3
          Kill-Image $prev
          if (-not (Wait-PortsFree 60)) { throw '情境E-red: 清場後埠未釋放' }

          Write-Host '=== 情境 (e-green): 上一建置 stack × 新殼 — 預期戳記不符 → 清除舊建置、啟動自家引擎 ==='
          $env:HWLINEHELPER_HOME = Join-Path $env:RUNNER_TEMP 'scenE-data'
          Seed-AutoLogin $env:HWLINEHELPER_HOME
          $supE = Start-Process $prev -PassThru
          if (-not (Wait-ServicesUp 150)) { throw '情境E-green: prev 引擎 150 秒未就緒' }
          $appE = Start-Process $newApp -PassThru
          $logE = Join-Path $env:HWLINEHELPER_HOME 'logs\shell.log'
          $stampE = $false; $prevLeftE = -1; $newEngE = 0; $swappedE = $false
          foreach ($i in 1..120) {
            Start-Sleep -Seconds 2
            $stampE = (Test-Path $logE) -and ((Get-Content $logE -Raw) -match '版本戳記不符')
            $prevLeftE = @(Get-ImagePids $prev).Count
            $newEngE = @(Get-NewEnginePids $env:HWLINEHELPER_HOME).Count
            if ($stampE -and $prevLeftE -eq 0 -and $newEngE -gt 0) { $swappedE = $true; break }
          }
          $wlE = 0
          try { $wlE = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3790/api/line/whitelist' -TimeoutSec 5).StatusCode } catch { if ($_.Exception.Response) { $wlE = [int]$_.Exception.Response.StatusCode } }
          @("scenario=e_new_shell_replaces_prev_build", "stamp_logged=$stampE", "prev_pids_left=$prevLeftE", "new_engine_pids=$newEngE", "swapped=$swappedE", "whitelist_status=$wlE") | Set-Content (Join-Path $ev 'legacy-e.txt')
          @("scenario=e_new_shell_replaces_prev_build", "stamp_logged=$stampE", "prev_pids_left=$prevLeftE", "new_engine_pids=$newEngE", "swapped=$swappedE", "whitelist_status=$wlE") | Write-Host
          if (-not $swappedE) { throw '情境E-green: 新殼未在時限內以版本戳記辨識並換掉 prev 建置 stack' }
          if ($wlE -ne 200) { throw "情境E-green: 換版後白名單端點實打應為 200, 實際 $wlE" }
          Write-Host '情境E-green: 已換版且白名單端點 200 — 驗證結束路徑'
          Start-Process $newApp -ArgumentList '--quit' -Wait
          $exitedE = $appE.WaitForExit(120000)
          $freeE = Wait-PortsFree 30
          @("scenario=e_new_shell_replaces_prev_build_quit", "app_exited=$exitedE", "ports_free=$freeE", "cleanup_ok=$($exitedE -and $freeE)") | Set-Content (Join-Path $ev 'legacy-e-quit.txt')
          if (-not ($exitedE -and $freeE)) { throw '情境E-green: 新殼結束後埠未釋放或 App 未結束' }
          Write-Host '情境E: 通過'
          Write-Host '殘留情境五組全數完成'

      - name: 上傳情境存證
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-evidence
          path: legacy-evidence/
          if-no-files-found: warn
