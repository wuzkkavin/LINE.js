[package]
name = "aibao-app"
version = "1.0.0"
edition = "2021"
description = "AI寶 Windows 原生 App (Rust 殼 + 內嵌 LINE.js 引擎)"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
# 殼只呼叫本機 http://127.0.0.1 的 helper API, 不需要 TLS: 關掉預設的 rustls 避免多餘相依
ureq = { version = "2", default-features = false, features = ["json"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

# 本機 (Linux) cargo check 用: winit 需要 x11 後端才編得過; Windows 建置不套用本節
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", features = ["x11"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # 結束序列加嚴 (殘留清除): 依埠找 listen 行程 (GetExtendedTcpTable)、依 PID 查映像路徑與強制結束、
  # 掃行程快照找引擎目錄底下的殘留行程
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
